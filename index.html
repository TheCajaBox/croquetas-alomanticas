    />
    <!--
      El icono de la pestaña. Sin esto el navegador pedía /favicon.ico en cada
      carga y se llevaba un 404 en el registro de todo el mundo.

      Van los tres a propósito: el SVG es el que usan los navegadores de hoy y
      escala sin pixelarse, el .ico es para los que no entienden SVG y el PNG
      grande es el que se queda en la pantalla de inicio del móvil. Vite les pone
      delante la ruta base del sitio, que en Pages no es la raíz.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#14121a" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
