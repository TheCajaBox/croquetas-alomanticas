<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Sandbox Vue 2</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: transparent;
        color: #e9e3d7;
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 14px;
        box-sizing: border-box;
      }
      #escenario:empty::after {
        content: "Aquí saldrá lo que pinte tu componente.";
        color: #7d7488;
        font-style: italic;
      }
      button {
        font: inherit; padding: 6px 12px; margin: 2px 4px 2px 0; cursor: pointer;
        background: #2a2333; color: #e9e3d7;
        border: 1px solid #4a3f57; border-radius: 6px;
      }
      button:hover { background: #372d45; }
      input, select, textarea {
        font: inherit; padding: 5px 8px; border-radius: 6px;
        border: 1px solid #4a3f57; background: #1d1826; color: #e9e3d7;
      }
      ul, ol { padding-left: 22px; }
      a { color: #d59a5b; }
    </style>
  </head>
  <body>
    <div id="escenario"></div>

    <script src="../vendor/vue2.js"></script>
    <script src="./aserciones.js"></script>
    <script src="./runner-comun.js"></script>
    <script src="./montaje-vue2.js"></script>
    <script>
      arrancarRunner(crearMontaje(document.getElementById('escenario')))
    </script>
  </body>
</html>
